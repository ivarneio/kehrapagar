<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kehra Pagar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stiil.css">
</head>
<body>
  <header class="pais">
    <a class="logo" href="#avaleht">Kehra Pagar</a>
    <button class="menu-nupp" type="button" aria-label="Menüü">☰</button>
    <nav>
      <a href="#tooted" data-k="nav_tooted">Tooted</a>
      <a href="#telli" data-k="nav_telli">Telli</a>
      <a href="firmast.html" data-k="nav_firmast">Firmast</a>
      <a href="kauplus.html" data-k="nav_kauplus">Kauplus</a>
      <a href="#kontakt" data-k="nav_kontakt">Kontakt</a>
    </nav>
    <div class="parem">
      <div class="sots">
        <a href="https://facebook.com" aria-label="Facebook">f</a>
        <a href="https://instagram.com" aria-label="Instagram">i</a>
      </div>
      <div class="keeled">
        <button type="button" data-keel="et" class="sees">et</button>
        <button type="button" data-keel="ru">ru</button>
        <button type="button" data-keel="en">en</button>
      </div>
    </div>
  </header>

  <main>
    <section id="avaleht">
      <h1>Kehra Pagar</h1>
      <p class="markus" data-k="avaleht_markus">Avalehe pilt tuleb kaustast pealeht. Kui faili ei ole, on see vaade.</p>
    </section>

    <section id="tooted">
      <h2 data-k="tooted">Tooted</h2>
      <div class="grupid">
        <article class="grupp" data-jrk="1">
          <button type="button" data-k="grupp_kringlid">Kringlid</button>
          <div class="sisu"><div>
            <div class="riba">
              <button class="pisi" type="button" data-kringel="Kaneelikringel" data-pildid="pildid/kringel.svg|pildid/kringel.svg" data-sildid="1 kg|0,5 kg">
                <img src="pildid/kringel.svg" alt="Kaneelikringel"><span class="nimi">Kaneelikringel</span>
              </button>
              <button class="pisi" type="button" data-kringel="Kardemonikringel" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Kardemonikringel"><span class="nimi">Kardemonikringel</span>
              </button>
              <button class="pisi" type="button" data-kringel="Õunakringel" data-pildid="pildid/kringel.svg|pildid/kringel.svg" data-sildid="1 kg|0,5 kg">
                <img src="pildid/kringel.svg" alt="Õunakringel"><span class="nimi">Õunakringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Marjakringel"><span class="nimi">Marjakringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Moonikringel"><span class="nimi">Moonikringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Kirsikringel"><span class="nimi">Kirsikringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Pähklikringel"><span class="nimi">Pähklikringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Kohvikringel"><span class="nimi">Kohvikringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Šokolaadikringel"><span class="nimi">Šokolaadikringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Vanillikringel"><span class="nimi">Vanillikringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Toorjuustukringel"><span class="nimi">Toorjuustukringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Rosinakringel"><span class="nimi">Rosinakringel</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kringel.svg" data-sildid="1 kg">
                <img src="pildid/kringel.svg" alt="Piparkoogikringel"><span class="nimi">Piparkoogikringel</span>
              </button>
            </div>
          </div></div>
        </article>

        <article class="grupp" data-jrk="2">
          <button type="button" data-k="grupp_pagar">Pagaritooted</button>
          <div class="sisu"><div>
            <div class="riba">
              <button class="pisi" type="button" data-pildid="pildid/sai.svg" data-sildid="Sai">
                <img src="pildid/sai.svg" alt="Sai"><span class="nimi">Sai</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/sai.svg" data-sildid="Pirukas">
                <img src="pildid/sai.svg" alt="Pirukas"><span class="nimi">Pirukas</span>
              </button>
            </div>
          </div></div>
        </article>

        <article class="grupp" data-jrk="3">
          <button type="button" data-k="grupp_kondiiter">Kondiitritooted</button>
          <div class="sisu"><div>
            <div class="riba">
              <button class="pisi" type="button" data-pildid="pildid/kook.svg" data-sildid="Kook">
                <img src="pildid/kook.svg" alt="Kook"><span class="nimi">Kook</span>
              </button>
            </div>
          </div></div>
        </article>

        <article class="grupp" data-jrk="4">
          <button type="button" data-k="grupp_kypsised">Küpsised</button>
          <div class="sisu"><div>
            <div class="riba">
              <button class="pisi" type="button" data-pildid="pildid/kook.svg" data-sildid="250 g">
                <img src="pildid/kook.svg" alt="Jussike"><span class="nimi">Jussike</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kook.svg|pildid/kook.svg" data-sildid="250 g|500 g">
                <img src="pildid/kook.svg" alt="Kaeraküpsis"><span class="nimi">Kaeraküpsis</span>
              </button>
              <button class="pisi" type="button" data-pildid="pildid/kook.svg" data-sildid="250 g">
                <img src="pildid/kook.svg" alt="Piparkook"><span class="nimi">Piparkook</span>
              </button>
            </div>
          </div></div>
        </article>

        <article class="grupp" data-jrk="5">
          <button type="button" data-k="grupp_tordid">Tordid</button>
          <div class="sisu"><div>
            <div class="riba">
              <button class="pisi" type="button" data-pildid="pildid/tort.svg" data-sildid="Tort">
                <img src="pildid/tort.svg" alt="Tort"><span class="nimi">Tort</span>
              </button>
            </div>
          </div></div>
        </article>
      </div>
    </section>

    <section id="telli" class="grupp">
      <button type="button" data-k="telli">Telli</button>
      <div class="sisu"><div>
        <a class="helista" href="tel:+3720000000" data-k="helista">Helista ja telli</a>
        <form>
          <label><span data-k="vorm_tee">Tee</span>
            <select name="tee">
              <option value="valmis" data-k="vorm_valmis">Valmis kringel</option>
              <option value="fantaasia" data-k="vorm_fantaasia">Fantaasiakringel</option>
            </select>
          </label>
          <label><span data-k="vorm_kringel">Kringel</span>
            <select name="kringel">
              <option>Kaneelikringel</option>
              <option>Kardemonikringel</option>
              <option>Õunakringel</option>
            </select>
          </label>
          <fieldset class="taidised">
            <legend data-k="vorm_taidised">Täidised</legend>
            <label><input type="checkbox" name="taidis" value="kaneel"> Kaneel</label>
            <label><input type="checkbox" name="taidis" value="kardemon"> Kardemon</label>
            <label><input type="checkbox" name="taidis" value="suhkur"> Suhkur</label>
          </fieldset>
          <label><span data-k="vorm_suurus">Suurus</span>
            <select name="suurus">
              <option data-k="vorm_vaike">Väike</option>
              <option data-k="vorm_suur">Suur</option>
            </select>
          </label>
          <label><span data-k="vorm_paev">Järeletulemise päev</span>
            <input type="date" name="paev">
          </label>
          <label><span data-k="vorm_kell">Kellaaeg</span>
            <input type="time" name="kell">
          </label>
          <label><span data-k="vorm_nimi">Nimi</span>
            <input type="text" name="nimi">
          </label>
          <label><span data-k="vorm_telefon">Telefon</span>
            <input type="tel" name="telefon">
          </label>
          <label class="rida"><input type="checkbox" name="uudis"> <span data-k="vorm_uudis">Tahan uudiseid</span></label>
          <label><span data-k="vorm_epost">E-post</span>
            <input type="email" name="epost">
          </label>
          <button class="saada" type="submit" data-k="vorm_saada">Saada tellimus</button>
          <p class="olek"></p>
        </form>
      </div></div>
    </section>

    <div class="info">
      <section id="kontakt">
        <h2 data-k="kontakt">Kontakt</h2>
        <p class="markus" data-k="kontakt_markus">Telefon ja aadress on ka jaluses.</p>
      </section>
    </div>
  </main>

  <div class="taisekraan">
    <button class="sulge" type="button" data-k="sulge" aria-label="Sulge">×</button>
    <div class="kujud"></div>
    <button class="telli-nupp" type="button" data-k="telli" hidden>Telli</button>
  </div>

  <footer class="jalus">
    <span>Kehra Pagar</span>
    <a href="tel:+3720000000" data-k="jalus_helista">Helista</a>
    <span>Kehra</span>
  </footer>
  <script src="leht.js"></script>
</body>
</html>
