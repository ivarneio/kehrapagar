              <button class="pisi" type="button" data-pildid="pildid/kook.svg" data-sildid="1 tk"><img src="pildid/kook.svg" alt="Pähklikook"><span class="nimi">Pähklikook</span></button>
              <button class="pisi" type="button" data-pildid="pildid/kook.svg" data-sildid="1 tk"><img src="pildid/kook.svg" alt="Marjakook"><span class="nimi">Marjakook</span></button>

          </div></div>

        <article class="grupp" data-jrk="4">

            <div class="riba">
              <button class="pisi" type="button" data-pildid="pildid/tort.svg" data-sildid="Tort"><img src="pildid/tort.svg" alt="Tort"><span class="nimi">Tort</span></button>

    <section id="telli" class="grupp">
      <button type="button" data-k="telli">Telli</button>
      <div class="sisu"><div>
        <a class="helista" href="tel:+3720000000" data-k="helista">Helista ja telli</a>
        <form>
          <label><span data-k="vorm_tee">Tee</span>
            <select name="tee">
              <option value="valmis" data-k="vorm_valmis">Valmis kringel</option>
              <option value="fantaasia" data-k="vorm_fantaasia">Fantaasiakringel</option>
            </select>
          </label>
          <label><span data-k="vorm_kringel">Kringel</span>
            <select name="kringel">
              <option>Kaneelikringel</option>
              <option>Kardemonikringel</option>
              <option>Õunakringel</option>
            </select>
          </label>
          <fieldset class="taidised">
            <legend data-k="vorm_taidised">Täidised</legend>
            <label><input type="checkbox" name="taidis" value="kaneel"> Kaneel</label>
            <label><input type="checkbox" name="taidis" value="kardemon"> Kardemon</label>
            <label><input type="checkbox" name="taidis" value="suhkur"> Suhkur</label>
          </fieldset>
          <label><span data-k="vorm_suurus">Suurus</span>
            <select name="suurus">
              <option data-k="vorm_vaike">Väike</option>
              <option data-k="vorm_suur">Suur</option>
            </select>
          </label>
          <label><span data-k="vorm_paev">Järeletulemise päev</span>
            <input type="date" name="paev">
          </label>
          <label><span data-k="vorm_kell">Kellaaeg</span>
            <input type="time" name="kell">
          </label>
          <label><span data-k="vorm_nimi">Nimi</span>
            <input type="text" name="nimi">
          </label>
          <label><span data-k="vorm_telefon">Telefon</span>
            <input type="tel" name="telefon">
          </label>
          <label class="rida"><input type="checkbox" name="uudis"> <span data-k="vorm_uudis">Tahan uudiseid</span></label>
          <label><span data-k="vorm_epost">E-post</span>
            <input type="email" name="epost">
          </label>
          <button class="saada" type="submit" data-k="vorm_saada">Saada tellimus</button>
          <p class="olek"></p>
        </form>
      </div></div>
    </section>

    <div class="info">

        <h2 data-k="kontakt">Kontakt</h2>
        <p class="markus" data-k="kontakt_markus">Telefon ja aadress on ka jaluses.</p>
